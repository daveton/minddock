[package]
name = "minddock"
version = "0.1.0"
description = "MindDock desktop app"
authors = ["MindDock"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "minddock_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
